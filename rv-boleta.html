<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#22105a">
<title>Boleta de ações · Rico.Work</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%23ff5a00%22/%3E%3Ctext x=%2216%22 y=%2221%22 font-size=%2213%22 font-family=%22Arial%22 font-weight=%22bold%22 fill=%22white%22 text-anchor=%22middle%22%3ERW%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="top" data-page="rv"></header>

<main>
  <h1>Boleta de ações</h1>
  <p class="lead">Monte as ordens do cliente e envie o e-mail pedindo o de acordo.</p>

  <div class="card">
    <div class="card-head"><h2><span class="step">1</span>Cliente</h2></div>
    <div class="fields three">
      <label class="f">Nome do cliente <input id="nome" placeholder="Nome"></label>
      <label class="f">Código do cliente <input id="codigo" inputmode="numeric" placeholder="Conta"></label>
      <label class="f">E-mail <input id="email" type="email" inputmode="email" placeholder="cliente@email.com"></label>
    </div>
  </div>

  <div class="card">
    <div class="card-head"><h2><span class="step">2</span>Ordens</h2>
      <div class="row no-print"><button class="sm ghost" id="btnLimpar">Limpar</button></div></div>
    <div id="ordens"></div>
    <div class="row no-print" style="margin-top:12px">
      <button class="sm secondary" id="btnAddC">+ Compra</button>
      <button class="sm secondary" id="btnAddV">+ Venda</button>
    </div>
    <div class="row no-print" style="margin-top:16px">
      <button id="btnEmail">✉️ E-mail pedindo de acordo</button>
      <button class="secondary" id="btnCopiar">Copiar tabela</button>
    </div>
    <p class="note">O e-mail traz as colunas Ativo_Ticker, Operação, Quantidade, Código_Cliente e Preço. Quando o cliente responder com o de acordo, é só encaminhar ao broker.</p>
  </div>
</main>

<script src="assets/common.js"></script>
<script src="assets/email.js"></script>
<script src="assets/ordens.js"></script>
<script>
const $ = id => document.getElementById(id);
const B = Object.assign({ nome: '', codigo: '', email: '' }, store.get('rw_boleta_cliente', {}));
['nome', 'codigo', 'email'].forEach(k => { $(k).value = B[k] || ''; $(k).addEventListener('input', e => { B[k] = e.target.value.trim(); store.set('rw_boleta_cliente', B); }); });
const ordens = Ordens.criar({
  el: $('ordens'), chave: 'rw_boleta_ordens',
  cliente: () => B,
  salvarCliente: (nome, para) => { B.nome = nome || B.nome; B.email = para; $('nome').value = B.nome; $('email').value = B.email; store.set('rw_boleta_cliente', B); },
});
if (!ordens.lista().length) ordens.adicionar({ op: 'C' });
$('btnAddC').onclick = () => ordens.adicionar({ op: 'C' });
$('btnAddV').onclick = () => ordens.adicionar({ op: 'V' });
$('btnLimpar').onclick = () => { ordens.limpar(); ordens.adicionar({ op: 'C' }); };
$('btnEmail').onclick = () => ordens.email();
$('btnCopiar').onclick = () => { if (!ordens.validas().length) { toast('Preencha ao menos uma ordem'); return; } copyText(ordens.tsv()); };
</script>
</body>
</html>
