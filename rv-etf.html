<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#22105a">
<title>Radar de ETFs · WorkBroker</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%23ff5a00%22/%3E%3Ctext x=%2216%22 y=%2221%22 font-size=%2213%22 font-family=%22Arial%22 font-weight=%22bold%22 fill=%22white%22 text-anchor=%22middle%22%3EWB%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/style.css?v=202611271455">
<link rel="stylesheet" href="assets/radar-lista.css?v=202611271455">
</head>
<body>
<header class="top" data-page="radar"></header>

<main>
  <h1>Radar de ETFs</h1>
  <p class="lead">Os ETFs da B3 hoje: maiores altas e quedas, com uma linha explicando o que cada um acompanha, e a lista completa por categoria.</p>
  <div id="radar"><p class="note">Carregando…</p></div>
  <p class="note" id="rodape" style="margin-top:16px"></p>
</main>

<div class="modal-bg no-print" id="dlg" hidden>
  <div class="modal acao" role="dialog" aria-modal="true">
    <div class="modal-head"><h2 id="dlgT" style="font-size:18px"></h2><button class="ghost" id="dlgX" aria-label="Fechar">✕</button></div>
    <div id="dlgB"></div>
  </div>
</div>

<script src="assets/common.js?v=202611271455"></script>
<script src="assets/radar-lista.js?v=202611271455"></script>
<script>
(async () => {
  const el = document.getElementById('radar');
  try {
    const D = await carregarDados('radar_mundo.json');
    if (!D || !(D.b3etf || []).length) throw 0;
    RL.radarLista(el, D.b3etf, { id: 'etf-b3', moeda: 'R$', ref: ['BOVA11', 'IVVB11'], refRot: { BOVA11: 'Ibovespa', IVVB11: 'S&P 500 em R$' },
      rotulo: 'ETFs', tituloTabela: 'Todos os ETFs', tv: tk => `BMFBOVESPA:${tk}` });
    document.getElementById('rodape').textContent = `Cotações do Yahoo Finance com atraso de até 15 minutos, atualizadas a cada 15 minutos mais ou menos. Lista com os ${D.b3etf.length} ETFs mais conhecidos da B3; ETFs pouco negociados podem ter variações grandes com poucos negócios.`;
  } catch { el.innerHTML = '<p class="note">Os dados dos ETFs ainda não estão disponíveis. Tente de novo em alguns minutos.</p>'; }
})();
</script>
</body>
</html>
