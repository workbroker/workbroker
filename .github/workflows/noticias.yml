name: Atualizar notícias e indicadores

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/noticias.py
      - scripts/macro.py
      - .github/workflows/noticias.yml

permissions:
  contents: write

concurrency:
  group: noticias
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Buscar manchetes do InfoMoney
        run: python scripts/noticias.py
      - name: Buscar indicadores macro
        run: python scripts/macro.py
      - name: Salvar se mudou
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/
            git commit -m "Atualiza notícias e indicadores"
            git pull --rebase origin main
            git push
          else
            echo "Sem mudanças"
          fi
